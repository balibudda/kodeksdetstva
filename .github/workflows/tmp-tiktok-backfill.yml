name: TMP — разовая публикация уже готового ролика в TikTok

# Одноразовый workflow (15.09.2026) — добавить УЖЕ одобренный и
# опубликованный на YouTube/Facebook пилотный ролик ещё и в TikTok
# черновиком, скачав его по прямой ссылке (сам файл не хранится в репо).
# Не трогает posted-comedy.json, не публикует повторно на другие каналы.
# Удалить файл после одного успешного запуска.

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: Прямая ссылка на .mp4
        required: true
        type: string
      caption_url:
        description: Прямая ссылка на .txt с описанием
        required: true
        type: string

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Скачать видео и описание
        run: |
          mkdir -p /tmp/tiktok-backfill
          curl -sL "${{ github.event.inputs.video_url }}" -o /tmp/tiktok-backfill/video.mp4
          curl -sL "${{ github.event.inputs.caption_url }}" -o /tmp/tiktok-backfill/caption.txt
          ls -la /tmp/tiktok-backfill
      - name: Опубликовать в TikTok черновиком
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_ASSETS_TOKEN }}
        run: node scripts/social/post-tiktok.mjs --video=/tmp/tiktok-backfill/video.mp4 --caption=/tmp/tiktok-backfill/caption.txt
